# pnpm 11 起 .npmrc 仅保留认证与 registry 设置，
# 其余构建配置须写在 pnpm-workspace.yaml（原 .npmrc 中 node-linker/legacy-peer-deps 等已不再被读取）
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: false
  'core-js-pure': true
  esbuild: true

# Taro 依赖大量未显式声明的传递依赖，必须用扁平化结构
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: false

# @tarojs/plugin-framework-react 声明 peerOptional vite@^4，本项目用 webpack5 编译器不装 vite
legacyPeerDeps: true

# pnpm 11 的 runDepsStatusCheck 在 hoisted 模式下误判依赖不一致，
# 每次运行脚本前都强制 install 且失败，这里关闭运行前自动检查（依赖已手动装好）
verifyDepsBeforeRun: false
