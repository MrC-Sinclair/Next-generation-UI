# Gradle / Kotlin 编译参数
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
kotlin.incremental.js.ir=true

# Kuikly 版本（业务模块与宿主壳共用）
KUIKLY_VERSION=2.26.0-2.1.21
KOTLIN_VERSION=2.1.21

# H5-only：shared 仅含 js(IR) target，无 AGP 提供的 compileOnly 配置。
# 插件自动注入 compileOnly/ksp 的远程依赖会因配置缺失而失败，
# 故置 useLocalKsp=true 跳过自动注入；core-ksp 处理器已由 shared/build.gradle.kts
# 显式声明到 kspJs，JS 打包链路不受影响。
kuikly.useLocalKsp=true

# Kotlin/JS 构建需要 yarn，默认从 GitHub Releases 下载。
# 国内网络直连 GitHub 经常超时，这里改走镜像（末尾斜杠不要丢）。
# 如果你能直连 GitHub，注释掉这一行即可。
yarnDownloadBaseUrl=https://ghfast.top/https://github.com/yarnpkg/yarn/releases/download/
