<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>林深 · 跨端工程师</title>
    <meta name="description" content="林深的个人站点——用 Kuikly 构建，把物理世界的按压感翻译成看得见的阴影反馈。">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5CFF'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23FFFFFF' font-family='sans-serif'%3E%E6%9E%97%3C/text%3E%3C/svg%3E">
</head>
<style>
    *{
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body { height: 100%; }
    body {
        overflow: hidden;
        /* 注意：这里故意不声明 font-family——Kuikly H5 渲染器对 Text 的
           测量字体与实际渲染字体必须一致，否则中英混排文本会被测窄 1px
           而在空格处折行。系统默认字体（Windows 雅黑 / macOS 苹方）本身
           就是期望的中文字体。 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* 页面氛围：页面本体交给 Kuikly（根视图透明），渐变光斑从底下透出来 */
        background-color: #EEF0F4;
        background-image:
            radial-gradient(1100px 540px at 88% -10%, rgba(47, 92, 255, 0.09), transparent 62%),
            radial-gradient(920px 500px at -12% 110%, rgba(255, 122, 69, 0.08), transparent 58%),
            linear-gradient(180deg, #F3F5F9 0%, #EDEFF4 100%);
        background-attachment: fixed;
    }
    ::selection { background: rgba(47, 92, 255, 0.16); }
    /* 隐藏输入框边框的样式 */
    input:focus {
      outline: none;
    }
    /* toast提示框的样式 */
    .toast-wrapper {
        position: fixed;
        z-index: 100000;
        height: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 70px;
        background-color: white;
    }
    .toast-content {
        display: flex;
        font-size: 12px;
        line-height: 30px;
        min-width: 150px;
        border: 1px solid gray;
        border-radius: 5px;
        justify-content: center;
    }
    /* 隐藏滚动条的样式 */
    .list-no-scrollbar {
        scrollbar-width: none;
    }
    .list-no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    /* 转菊花的动画样式 */
    @keyframes activityIndicatorRotate {
        0% { transform: rotate(0deg) }
        100% { transform: rotate(360deg) }
    }

    /* ----------------------------------------------------------------
       按压反馈过渡（触感反馈可视化 · H5 单端承接）
       ----------------------------------------------------------------
       Kuikly 2.26 在本工程的动画管线从未触发（详见 shared 侧 Haptic.kt
       顶部「关于过渡」说明），且 box-shadow 在任何端都不可被 Kuikly 动画。
       因此按压的"过程"交由宿主 CSS 承接：Kuikly 只负责把目标态写进内联
       样式（transform / box-shadow / background-color），这里让浏览器在
       两次状态之间补帧。
       选取 #root div 而非 *：按压元素都是 div，且避免误伤其它宿主节点。
       曲线 cubic-bezier(0.2,0,0,1) = 快起快落的"咔哒"手感；140ms 既跟手又不拖。
    ---------------------------------------------------------------- */
    #root div {
        transition:
            transform 140ms cubic-bezier(0.2, 0, 0, 1),
            box-shadow 140ms cubic-bezier(0.2, 0, 0, 1),
            background-color 140ms ease-out;
    }
</style>
<body>
<div id="root"></div>
<script type="text/javascript" src="http://127.0.0.1:8083/nativevue2.js"></script>
<script type="text/javascript" src="h5App.js"></script>
</body>
</html>
